name: fairbid
description: FairBid - Trustful Auction App with Advanced Splash
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.7
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  provider: ^6.1.1
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.0
  animated_text_kit: ^4.3.0
  audioplayers: ^6.6.0
  google_fonts: ^6.2.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  google_maps_flutter: ^2.17.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon" 
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
